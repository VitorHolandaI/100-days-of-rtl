name: simular

on: [push, pull_request]

jobs:
  simular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: instalar iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: testes dos scripts
        run: python3 -m unittest discover -s testes
      - name: simular todos os itens
        run: ferramentas/rodar_todos.sh
